version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: isro_postgres
    environment:
      - POSTGRES_DB=netra_data
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=netrasecret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  isro-dashboard:
    build: .
    container_name: isro_netra_dashboard
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - PORT=8080
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:netrasecret@postgres:5432/netra_data
      # - GEMINI_API_KEY=your_gemini_api_key_here # Uncomment and add key to enable server-side agentic loops
    volumes:
      - ./db-local.json:/app/db-local.json # Persist local database logs to your host machine
    restart: always

volumes:
  pgdata:

