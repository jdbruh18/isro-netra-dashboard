version: '3.8'

services:
  isro-dashboard:
    build: .
    container_name: isro_netra_dashboard
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      # - GEMINI_API_KEY=your_gemini_api_key_here # Uncomment and add key to enable server-side agentic loops
    volumes:
      - ./db-local.json:/app/db-local.json # Persist local database logs to your host machine
    restart: always
