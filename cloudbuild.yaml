steps:
  # Step 1: Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/isro-netra-dashboard:$COMMIT_SHA'
      - '.'

  # Step 2: Push the container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/isro-netra-dashboard:$COMMIT_SHA'

  # Step 3: Deploy the image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'isro-netra-dashboard'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/isro-netra-dashboard:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/isro-netra-dashboard:$COMMIT_SHA'

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'space-ops-repo'

options:
  logging: CLOUD_LOGGING_ONLY
